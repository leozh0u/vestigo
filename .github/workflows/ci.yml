name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The package itself has no dependencies, so the dev extra is only pytest.
      # That keeps the run under a second and means a red build is a real failure
      # rather than a resolver having a bad day.
      - run: pip install -e ".[dev]"
      - run: pytest -q
