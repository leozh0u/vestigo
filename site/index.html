<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vestigo — where a photo was taken, and how much to believe it</title>
    <meta name="description"
          content="An evidence-based geolocation agent. It answers at the
                   precision the evidence supports, and stops." />

    <!--
      Two typefaces, doing two jobs.

      Instrument Serif is the wordmark and the answer. It has the look of an
      engraved atlas rather than a product, which is the register this is
      aiming for: an instrument, not a service.

      JetBrains Mono is everything measured. Numbers in a monospace read as
      readings rather than as copy, and the whole argument of the page is that
      its numbers mean something.

      preconnect first: it opens the connection while the CSS is still being
      parsed, which is worth roughly a round trip on a cold load.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Depth, painted in CSS behind the globe. Three layers: a cold aurora,
         a warm one, and film grain over both. -->
    <div class="atmosphere" aria-hidden="true">
      <div class="aurora aurora-cold"></div>
      <div class="aurora aurora-warm"></div>
      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <canvas id="stage"></canvas>

    <main id="ui" data-state="idle">
      <header class="masthead">
        <a class="wordmark" href="/">
          <!-- The mark: a meridian crossing a sphere, and the point where a
               trace lands on it. Vestigo is Latin for "I track". -->
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <circle cx="16" cy="16" r="12.5" fill="none"
                    stroke="currentColor" stroke-width="1.25" opacity="0.55" />
            <ellipse cx="16" cy="16" rx="5" ry="12.5" fill="none"
                     stroke="currentColor" stroke-width="1.25" opacity="0.35" />
            <path d="M3.5 16h25" stroke="currentColor" stroke-width="1.25"
                  opacity="0.35" />
            <circle cx="22.2" cy="9.4" r="2.6" fill="currentColor" />
          </svg>
          <span>Vestigo</span>
        </a>
        <p class="tagline">
          Where a photo was taken<span class="soft">, and how much to believe it.</span>
        </p>
      </header>

      <div class="stack">
        <section class="evidence" id="evidence" aria-live="polite"></section>
        <section class="receipt" id="receipt" hidden></section>
      </div>

      <footer class="bar">
        <div class="examples" id="examples"></div>
        <form class="prompt" id="prompt">
          <input id="context" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Choose a photograph above" />
          <button type="submit">Locate</button>
        </form>
        <p class="note">
          Every example is a recording of a real run. Nothing here is staged.
        </p>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
