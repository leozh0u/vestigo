[project]
name = "vestigo"
version = "0.1.0"
description = "Work out where a photograph was taken, and say how sure you are"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
data = ["pillow"]
# numpy and pillow are here because two test modules import them: the embedding
# checkpoint test compares arrays, and the fetcher test imports a script that
# opens images. The package itself still has no runtime dependencies.
#
# CI was red on every push for a day without either. The failure was a
# collection error rather than a test failure, so it never told anyone which
# behaviour had broken — it just said the suite would not start, which is easy
# to read as noise and ignore.
dev = ["pytest", "numpy", "pillow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vestigo", "vestigo.tools", "ml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
