[project]
name = "vestigo"
version = "0.1.0"
description = "Work out where a photograph was taken, and say how sure you are"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
data = ["pillow"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vestigo", "vestigo.tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
